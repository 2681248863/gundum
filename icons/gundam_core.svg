<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 透明背景 -->
  <rect width="100" height="100" fill="none"/>
  
  <!-- 定义渐变 -->
  <defs>
    <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0.3"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 六边形边框 -->
  <polygon points="50,10 85,25 85,75 50,90 15,75 15,25" fill="none" stroke="#ffcc00" stroke-width="2" filter="url(#glow)"/>
  <polygon points="50,15 80,28 80,72 50,85 20,72 20,28" fill="none" stroke="#ff6600" stroke-width="1"/>
  
  <!-- 能量核心 -->
  <circle cx="50" cy="50" r="20" fill="url(#coreGradient)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="15" fill="#ff3300"/>
  <circle cx="50" cy="50" r="8" fill="#ffffff"/>
  
  <!-- 粒子效果 -->
  <circle cx="35" cy="40" r="2" fill="#ffffff"/>
  <circle cx="65" cy="45" r="1.5" fill="#ffffff"/>
  <circle cx="42" cy="60" r="2.5" fill="#ffffff"/>
  <circle cx="58" cy="55" r="1" fill="#ffffff"/>
  <circle cx="48" cy="35" r="1.8" fill="#ffffff"/>
  <circle cx="52" cy="65" r="2.2" fill="#ffffff"/>
  <circle cx="38" cy="50" r="1.2" fill="#ffffff"/>
  <circle cx="62" cy="40" r="1.6" fill="#ffffff"/>
</svg>