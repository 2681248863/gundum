  <path d="M30 70 L70 70" stroke="#00bfff" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M30 30 L30 70" stroke="#00bfff" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M50 30 L50 70" stroke="#00bfff" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M70 30 L70 70" stroke="#00bfff" stroke-width="1" stroke-dasharray="2,2"/>
</svg>